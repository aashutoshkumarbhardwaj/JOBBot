name: Sakshi Job Alert Bot

on:
  schedule:
    # Runs once every 2 days to prevent being blocked by job portals.
    - cron: "0 0 */2 * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run monitor
        env:
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" python sakshi_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add seen_jobs_sakshi.json
          git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
          git push
